name: scripts tests

# Runs the hub scripts' and hooks' test suites on every push to main and every pull request.
# Tests run with an empty HOME, so none of them can read or write a developer's live ~/.claude.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pytest
      - name: pytest (skipped or deselected tests fail the job)
        working-directory: global/.claude/scripts
        run: |
          # GitHub's default shell has no pipefail, so without this a failing pytest piped into tee left the job green.
          set -o pipefail
          export HOME="$(mktemp -d)"
          python3 -m pytest tests test_*.py -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/pytest.out"
          # A skipped test is not a passing test; class-list behavior uses temporary test files.
          skips="$(grep -c '^SKIPPED' "$RUNNER_TEMP/pytest.out" || true)"
          if [ "$skips" != 0 ]; then echo "::error::unexpected skipped tests: $skips"; exit 1; fi
          # A deselected test never runs either; pytest only counts it in the summary line ("5 deselected"), never as SKIPPED.
          if grep -qE '[0-9]+ deselected' "$RUNNER_TEMP/pytest.out"; then echo "::error::deselected tests never ran: $(grep -E '[0-9]+ deselected' "$RUNNER_TEMP/pytest.out" | tail -n 1)"; exit 1; fi
          summary="$(grep -E '^[0-9]+ (passed|failed|skipped)' "$RUNNER_TEMP/pytest.out" | tail -n 1)"
          if [ -z "$summary" ]; then echo "::error::pytest summary missing"; exit 1; fi
          echo "Pytest summary: $summary; $skips skipped; 0 deselected"
      - name: hook tests (skipped or deselected tests fail the job)
        working-directory: global/.claude/hooks
        run: |
          # Issue 224: the hooks' own tests live in global/.claude/hooks/tests and the step above never collected them.
          set -o pipefail
          export HOME="$(mktemp -d)"
          # LiveHook runs the hook installed at $HOME/.claude/hooks/block-outbound.sh. The tower's real one is private, so the job installs the
          # stand-in (tests/fixtures/block-outbound.case.sh) and the repo's guard into the temporary HOME and LiveHook runs against those.
          # Whether the stand-in still equals the real hook is checked by install_scripts.py on the tower. Nothing is deselected: a deselected test never runs.
          mkdir -p "$HOME/.claude/hooks"
          cp tests/fixtures/block-outbound.case.sh "$HOME/.claude/hooks/block-outbound.sh"
          cp draft-recipient-guard.py "$HOME/.claude/hooks/draft-recipient-guard.py"
          python3 -m pytest tests -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/hooks-pytest.out"
          skips="$(grep -c '^SKIPPED' "$RUNNER_TEMP/hooks-pytest.out" || true)"
          if [ "$skips" != 0 ]; then echo "::error::unexpected skipped hook tests: $skips"; exit 1; fi
          if grep -qE '[0-9]+ deselected' "$RUNNER_TEMP/hooks-pytest.out"; then echo "::error::deselected hook tests never ran: $(grep -E '[0-9]+ deselected' "$RUNNER_TEMP/hooks-pytest.out" | tail -n 1)"; exit 1; fi
          summary="$(grep -E '^[0-9]+ (passed|failed|skipped)' "$RUNNER_TEMP/hooks-pytest.out" | tail -n 1)"
          if [ -z "$summary" ]; then echo "::error::hook pytest summary missing"; exit 1; fi
          echo "Hook pytest summary: $summary; $skips skipped; 0 deselected"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: shell tests
        working-directory: global/.claude/scripts
        run: |
          export HOME="$(mktemp -d)"
          failed=0
          for t in tests/test_*.sh; do
            # Needs wsl.exe and the OpenClawGateway distro: it only runs inside that distro, so a runner cannot.
            [ "$t" = tests/test_openclaw_uid_stage.sh ] && { echo "excluded (WSL only): $t"; continue; }
            echo "::group::$t"
            if timeout 600 bash "$t"; then :; else echo "::error::$t failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit "$failed"
