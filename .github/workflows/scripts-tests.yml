name: scripts tests

# Runs the hub scripts' and hooks' test suites on every push to main and every pull request,
# and on demand (gh workflow run) so a push that GitHub does not trigger can still be tested.
# Tests run with an empty HOME, so none of them can read or write a developer's live ~/.claude.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pytest
      - name: allow user namespaces (ticket 81)
        run: |
          # Both pytest steps below start again inside closed_room.sh (tests/conftest.py and hooks/tests/conftest.py), which needs a user and mount
          # namespace. Ubuntu 24.04 runners block that by default through AppArmor. This step lifts the block; closed_room.sh exits 97 and
          # runs nothing if it is still off, so a blocked runner fails the job, never an unprotected run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "sysctl not present; checking directly below"
          unshare -Urm true && echo "user namespaces work"
      - name: pytest (skipped or deselected tests fail the job)
        working-directory: global/.claude/scripts
        run: |
          # GitHub's default shell has no pipefail, so without this a failing pytest piped into tee left the job green.
          set -o pipefail
          export HOME="$(mktemp -d)"
          # A test file that collected nothing (or was ignored) never runs; every file this suite must run needs at least one collected test.
          python3 -m pytest tests test_*.py --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/collected.out"
          python3 "$GITHUB_WORKSPACE/.github/scripts/ci_test_coverage.py" pytest-ran "$RUNNER_TEMP/collected.out" scripts
          python3 -m pytest tests test_*.py -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/pytest.out"
          # A skipped test is not a passing test; class-list behavior uses temporary test files.
          skips="$(grep -c '^SKIPPED' "$RUNNER_TEMP/pytest.out" || true)"
          if [ "$skips" != 0 ]; then echo "::error::unexpected skipped tests: $skips"; exit 1; fi
          # A deselected test never runs either; pytest only counts it in the summary line ("5 deselected"), never as SKIPPED.
          if grep -qE '[0-9]+ deselected' "$RUNNER_TEMP/pytest.out"; then echo "::error::deselected tests never ran: $(grep -E '[0-9]+ deselected' "$RUNNER_TEMP/pytest.out" | tail -n 1)"; exit 1; fi
          summary="$(grep -E '^[0-9]+ (passed|failed|skipped)' "$RUNNER_TEMP/pytest.out" | tail -n 1)"
          if [ -z "$summary" ]; then echo "::error::pytest summary missing"; exit 1; fi
          echo "Pytest summary: $summary; $skips skipped; 0 deselected"
      - name: hook tests (skipped or deselected tests fail the job)
        working-directory: global/.claude/hooks
        run: |
          # Issue 224: the hooks' own tests live in global/.claude/hooks/tests and the step above never collected them.
          set -o pipefail
          export HOME="$(mktemp -d)"
          # LiveHook runs the hook installed at $HOME/.claude/hooks/block-outbound.sh. The tower's real one is private, so the job installs the
          # stand-in (tests/fixtures/block-outbound.case.sh) and the repo's guard into the temporary HOME and LiveHook runs against those.
          # Whether the stand-in still equals the real hook, and the hand copy of the guard the repo's, is checked by install_scripts.py on the tower. Nothing is deselected: a deselected test never runs.
          mkdir -p "$HOME/.claude/hooks"
          cp tests/fixtures/block-outbound.case.sh "$HOME/.claude/hooks/block-outbound.sh"
          cp draft-recipient-guard.py "$HOME/.claude/hooks/draft-recipient-guard.py"
          # The guard reads the owner's address at run time from this private file; on a runner it holds a placeholder.
          mkdir -p "$HOME/.config/afa"
          printf '{"draft_recipient": "owner@example.com"}\n' > "$HOME/.config/afa/identity-guard.json"
          python3 -m pytest tests --collect-only -q -p no:cacheprovider > "$RUNNER_TEMP/hooks-collected.out"
          python3 "$GITHUB_WORKSPACE/.github/scripts/ci_test_coverage.py" pytest-ran "$RUNNER_TEMP/hooks-collected.out" hooks
          python3 -m pytest tests -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/hooks-pytest.out"
          skips="$(grep -c '^SKIPPED' "$RUNNER_TEMP/hooks-pytest.out" || true)"
          if [ "$skips" != 0 ]; then echo "::error::unexpected skipped hook tests: $skips"; exit 1; fi
          if grep -qE '[0-9]+ deselected' "$RUNNER_TEMP/hooks-pytest.out"; then echo "::error::deselected hook tests never ran: $(grep -E '[0-9]+ deselected' "$RUNNER_TEMP/hooks-pytest.out" | tail -n 1)"; exit 1; fi
          summary="$(grep -E '^[0-9]+ (passed|failed|skipped)' "$RUNNER_TEMP/hooks-pytest.out" | tail -n 1)"
          if [ -z "$summary" ]; then echo "::error::hook pytest summary missing"; exit 1; fi
          echo "Hook pytest summary: $summary; $skips skipped; 0 deselected"

  # Issue 72: one job running every shell test in a row took 19 minutes 59 seconds of its 20-minute limit on main, so the next added test
  # cancelled the job. The shell tests now run as three slices side by side, each on its own runner (so no two tests share a machine, the
  # same as before), and the "shell" job below, the name the branch protection requires, passes only when every slice passed.
  # The slice count is written twice here (the matrix list and the "/3" in the step); tests/test_ci_test_coverage.py fails if they disagree.
  shell-part:
    name: shell part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: allow user namespaces (issue 332)
        run: |
          # lane_hide_secrets.sh hides settings files from a lane with a user and mount namespace (unshare -Urm). Ubuntu 24.04 runners block that by
          # default through AppArmor. This step lifts the block; the guard's own test (test_lane_secret_guard.sh) fails, never skips, if it is still off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "sysctl not present; checking directly below"
          unshare -Urm true && echo "user namespaces work"
      - name: shell tests
        working-directory: global/.claude/scripts
        env:
          PART: ${{ matrix.part }}
        run: |
          export HOME="$(mktemp -d)"
          failed=0; ran=0
          # The list comes from ci_test_coverage.py, the same rule the "shell" job checks, so a file cannot fall out of the glob.
          # Files in .github/ci_not_run.tsv (test_openclaw_uid_stage.sh needs the WSL distro) are left out of it, with the reason and issue printed by that job.
          # A bad slice makes the tool exit non-zero; without this check the loop below would read an empty list and the job would only fail on "no shell test ran".
          python3 "$GITHUB_WORKSPACE/.github/scripts/ci_test_coverage.py" list shell --part "$PART/3" >"$RUNNER_TEMP/shell-part.txt"
          while IFS= read -r t; do
            echo "::group::$t"
            began=$SECONDS
            if timeout 600 bash "$t"; then :; else echo "::error::$t failed"; failed=1; fi
            took=$((SECONDS - began))
            echo "::endgroup::"
            echo "took ${took}s: $t"
            # One file may run 600 seconds; say so while there is still room, before a later change makes it time out.
            if [ "$took" -gt 480 ]; then echo "::warning::$t took ${took}s of the 600 it may use"; fi
            ran=$((ran + 1))
          done < "$RUNNER_TEMP/shell-part.txt"
          echo "shell tests run: $ran"
          if [ "$ran" -lt 1 ]; then echo "::error::no shell test ran"; failed=1; fi
          exit "$failed"

  shell:
    needs: shell-part
    # always(): without it a failed or cancelled slice would leave this job "skipped", and GitHub counts a skipped required check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: every test file has a runner
        run: |
          # Fails on a test file (anywhere in the repo) that no step here runs and that .github/ci_not_run.tsv does not openly list with a reason and an issue.
          python3 .github/scripts/ci_test_coverage.py check
      - name: every shell part passed
        env:
          PARTS_RESULT: ${{ needs.shell-part.result }}
        run: |
          # The result of a matrix job is "success" only when every one of its slices succeeded.
          echo "shell parts: $PARTS_RESULT"
          if [ "$PARTS_RESULT" != "success" ]; then echo "::error::the shell test parts ended as $PARTS_RESULT, not success"; exit 1; fi
      - name: node tests (skipped tests fail the job)
        working-directory: global/.claude/scripts
        run: |
          set -o pipefail
          export HOME="$(mktemp -d)"
          mapfile -t files < <(python3 "$GITHUB_WORKSPACE/.github/scripts/ci_test_coverage.py" list node)
          if [ "${#files[@]}" -lt 1 ]; then echo "::error::no node test file found"; exit 1; fi
          node --version
          node --test "${files[@]}" | tee "$RUNNER_TEMP/node.out"
          # node --test prints "# skipped N" / "# todo N" (older node) or "ℹ skipped N"; a skipped test is not a passing test.
          if grep -qE '^(#|ℹ) (skipped|todo|cancelled) [1-9]' "$RUNNER_TEMP/node.out"; then echo "::error::node tests skipped, todo or cancelled"; exit 1; fi
          grep -qE '^(#|ℹ) pass [1-9]' "$RUNNER_TEMP/node.out" || { echo "::error::node ran no passing test"; exit 1; }
