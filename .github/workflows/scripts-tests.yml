name: scripts tests

# Runs the hub scripts' test suite on every push to main and every pull request.
# Tests run with an empty HOME, so none of them can read or write a developer's live ~/.claude.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install pytest
      - name: pytest (skipped tests fail the job)
        working-directory: global/.claude/scripts
        run: |
          # GitHub's default shell has no pipefail, so without this a failing pytest piped into tee left the job green.
          set -o pipefail
          export HOME="$(mktemp -d)"
          python3 -m pytest tests test_email_voice_check.py -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/pytest.out"
          # A skipped test is not a passing test; class-list behavior uses temporary test files.
          skips="$(grep -c '^SKIPPED' "$RUNNER_TEMP/pytest.out" || true)"
          if [ "$skips" != 0 ]; then echo "::error::unexpected skipped tests: $skips"; exit 1; fi
          summary="$(grep -E '^[0-9]+ (passed|failed|skipped)' "$RUNNER_TEMP/pytest.out" | tail -n 1)"
          if [ -z "$summary" ]; then echo "::error::pytest summary missing"; exit 1; fi
          echo "Pytest summary: $summary; $skips skipped"

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: shell tests
        working-directory: global/.claude/scripts
        run: |
          export HOME="$(mktemp -d)"
          failed=0
          for t in tests/test_*.sh; do
            # Needs wsl.exe and the OpenClawGateway distro: it only runs inside that distro, so a runner cannot.
            [ "$t" = tests/test_openclaw_uid_stage.sh ] && { echo "excluded (WSL only): $t"; continue; }
            echo "::group::$t"
            if timeout 300 bash "$t"; then :; else echo "::error::$t failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit "$failed"
