<!doctype html>
<html><head><meta charset="utf-8"><title>Demo video smoke page</title>
<style>body{font-family:sans-serif;margin:40px}li{margin:14px 0;font-size:22px}button{font-size:20px;padding:8px 16px}</style></head>
<body>
<h1 id="top">Shopping list</h1>
<ul id="list"><li>Apples</li><li>Bread</li><li>Cheese</li></ul>
<input id="item" placeholder="Add an item" style="font-size:20px">
<button id="add" onclick="var l=document.createElement('li');l.textContent=document.getElementById('item').value;document.getElementById('list').appendChild(l)">Add</button>
<div style="height:1400px"></div>
<h2 id="bottom">The end</h2>
</body></html>
